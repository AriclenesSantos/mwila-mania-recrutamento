<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração de um editor de vídeo">
  <defs>
    <radialGradient id="bgGlowEV" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ee333e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ee333e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="260" fill="url(#bgGlowEV)"/>

  <!-- floating clapperboard -->
  <g transform="translate(304 40) rotate(-10)">
    <rect x="0" y="10" width="56" height="38" rx="4" fill="#1c1413" stroke="#f2e0de" stroke-width="3"/>
    <rect x="0" y="0" width="56" height="14" rx="3" fill="#f8f8f8"/>
    <g stroke="#1c1413" stroke-width="4">
      <line x1="8" y1="0" x2="18" y2="14"/>
      <line x1="24" y1="0" x2="34" y2="14"/>
      <line x1="40" y1="0" x2="50" y2="14"/>
    </g>
  </g>

  <!-- monitor -->
  <rect x="110" y="70" width="180" height="112" rx="10" fill="#1c1413" stroke="#f2e0de" stroke-width="4"/>
  <rect x="122" y="82" width="156" height="70" rx="4" fill="#65000b"/>
  <path d="M150 100 L184 117 L150 134 Z" fill="#f8f8f8"/>
  <!-- timeline -->
  <rect x="122" y="158" width="156" height="12" rx="3" fill="#0d0a0a"/>
  <rect x="128" y="161" width="40" height="6" rx="2" fill="#ee333e"/>
  <rect x="172" y="161" width="60" height="6" rx="2" fill="#f2e0de"/>
  <rect x="236" y="161" width="34" height="6" rx="2" fill="#c21725"/>
  <rect x="192" y="182" width="16" height="14" fill="#65000b"/>
  <rect x="170" y="196" width="60" height="8" rx="4" fill="#65000b"/>

  <!-- character -->
  <g>
    <ellipse cx="200" cy="150" rx="0" ry="0"/>
  </g>
  <g transform="translate(0 6)">
    <ellipse cx="200" cy="150" rx="32" ry="28" fill="#f2e0de"/>
    <path d="M168 138c0-28 64-28 64 0" fill="#65000b"/>
    <!-- headphones -->
    <path d="M164 138a36 36 0 0 1 72 0" fill="none" stroke="#c21725" stroke-width="7" stroke-linecap="round"/>
    <rect x="158" y="134" width="12" height="18" rx="5" fill="#c21725"/>
    <rect x="230" y="134" width="12" height="18" rx="5" fill="#c21725"/>
    <circle cx="188" cy="150" r="4.5" fill="#1c1413"/>
    <circle cx="212" cy="150" r="4.5" fill="#1c1413"/>
    <path d="M191 161c5 4 12 4 17 0" stroke="#1c1413" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</svg>
