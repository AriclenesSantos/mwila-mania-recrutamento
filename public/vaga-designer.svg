<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustração de um designer gráfico">
  <defs>
    <radialGradient id="bgGlowDG" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ee333e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ee333e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="260" fill="url(#bgGlowDG)"/>

  <!-- floating shapes -->
  <circle cx="320" cy="56" r="14" fill="#ee333e" opacity="0.8"/>
  <rect x="52" y="40" width="24" height="24" rx="6" fill="#f2e0de" opacity="0.7" transform="rotate(18 64 52)"/>
  <polygon points="330,110 344,134 316,134" fill="#f2e0de" opacity="0.6"/>

  <!-- drawing tablet -->
  <rect x="120" y="176" width="160" height="30" rx="8" fill="#1c1413" stroke="#f2e0de" stroke-width="4"/>
  <rect x="132" y="184" width="136" height="14" rx="3" fill="#65000b"/>

  <!-- character -->
  <g>
    <ellipse cx="200" cy="140" rx="33" ry="29" fill="#f2e0de"/>
    <path d="M166 128c0-30 68-30 68 0" fill="#65000b"/>
    <circle cx="188" cy="141" r="4.5" fill="#1c1413"/>
    <circle cx="212" cy="141" r="4.5" fill="#1c1413"/>
    <path d="M189 153c6 5 14 5 20 0" stroke="#1c1413" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M158 204c4-32 22-46 44-46s40 14 44 46z" fill="#c21725"/>
  </g>

  <!-- stylus hand -->
  <g transform="translate(238 176) rotate(-30)">
    <rect x="0" y="0" width="8" height="46" rx="4" fill="#f8f8f8"/>
    <path d="M0 0h8l-4-12z" fill="#ee333e"/>
  </g>

  <!-- palette -->
  <g transform="translate(120 150)">
    <ellipse cx="0" cy="0" rx="26" ry="19" fill="#f8f8f8"/>
    <circle cx="-10" cy="-6" r="4" fill="#c21725"/>
    <circle cx="2" cy="-9" r="4" fill="#ee333e"/>
    <circle cx="12" cy="-3" r="4" fill="#65000b"/>
    <circle cx="6" cy="6" r="4" fill="#1c1413"/>
  </g>
</svg>
